name: SceneSet-L1-tests
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/SceneSet-L1-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/SceneSet-L1-tests.yml'

env:
  BUILD_TYPE: Debug
  THUNDER_REF: "R4.4.3"
  INTERFACES_REF: "develop"

jobs:
  SceneSet-L1-tests:
    name: Build and run SceneSet unit tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
       # Set up Thunder cache
      - name: Set up Thunder cache
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            build/Thunder
            build/ThunderInterfaces
            build/ThunderTools
            install
            !install/etc/WPEFramework/plugins
            !install/usr/bin/libnmproxy_l1_test
            !install/usr/include/gmock
            !install/usr/include/gtest
            !install/usr/lib/libgmockd.a
            !install/usr/lib/libgmock_maind.a
            !install/usr/lib/libgtestd.a
            !install/usr/lib/libgtest_maind.a
            !install/usr/lib/cmake/GTest
            !install/usr/lib/pkgconfig/gmock.pc
            !install/usr/lib/pkgconfig/gmock_main.pc
            !install/usr/lib/pkgconfig/gtest.pc
            !install/usr/lib/pkgconfig/gtest_main.pc
            !install/usr/lib/wpeframework/plugins
          key: thunder-${{ env.THUNDER_REF }}-libnm
      
      - name: Install packages
        run: |
          sudo apt update
          sudo apt-get install -y pkg-config libglib2.0-dev libnm-dev libcurl4-openssl-dev lcov ninja-build libsystemd-dev valgrind libarchive-dev libxml2-dev libssl-dev liblz4-dev 

      - name: Configure Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: Configure CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.25.x'
      
      - name: Checkout thunder repositories
        run: |
          git clone https://github.com/rdkcentral/ThunderTools ThunderTools --branch ${{ env.THUNDER_REF }}
          git clone https://github.com/rdkcentral/Thunder Thunder --branch ${{ env.THUNDER_REF }}
          git clone https://github.com/rdkcentral/ThunderInterfaces ThunderInterfaces --branch ${{ env.THUNDER_REF }}

      - name: Build ThunderTools
        run: >
          cmake
          -S "${{github.workspace}}/ThunderTools" -B build/ThunderTools
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          &&
          cmake --build build/ThunderTools --target install -j8

      - name: Build Thunder
        run: >
          cmake
          -S "${{github.workspace}}/Thunder" -B build/Thunder
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBINDING=127.0.0.1
          -DPORT=9998
          &&
          cmake --build build/Thunder --target install -j8

      - name: ThunderInterfaces
        run: >
          cmake
          -S "${{github.workspace}}/ThunderInterfaces" -B build/ThunderInterfaces
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          &&
          cmake --build build/ThunderInterfaces --target install -j8
      
      - name: Checkout entservices-testframework
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: 1.0.1

      - name: Checkout SceneSet repository
        uses: actions/checkout@v3
        with:
          path: sceneset

      - name: Checkout googletest
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0


      - name: Checkout entservices-apis
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}

      - name: Checkout ralf-utils
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ralf-utils
          path: ralf-utils
          ref: f2ef8cb017e1f960a76427a4addf86c88d7a65ec

      - name: Build ralf-utils
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/ralf-utils"
          -B build/ralf-utils
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DRALF_UTILS_BUILD_UNIT_TESTS=OFF
          -DRALF_UTILS_BUILD_TOOLS=OFF
          &&
          cmake --build build/ralf-utils -j8
          &&
          cmake --install build/ralf-utils     
 
      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Setup WPEFramework interfaces directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces
          # Copy the IAppManager.h from entservices-apis
          cp entservices-apis/apis/AppManager/IAppManager.h $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/
          cp entservices-apis/apis/PreinstallManager/IPreinstallManager.h $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/
          cp entservices-apis/apis/PackageManager/IAppPackageManager.h $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/
          
          # Create a basic Ids.h file
          cat > $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/Ids.h << 'EOF'

          #pragma once

          #include <WPEFramework/core/core.h>

          namespace WPEFramework {
          namespace Exchange {

          // Interface IDs for AppManager
          enum InterfaceIds : uint32_t {
              ID_APPMANAGER                      = 0x00000200,
              ID_APPMANAGER_NOTIFICATION         = 0x00000201,
              ID_LOADED_APP_INFO_ITERATOR        = 0x00000202,

              // Interface IDs for PreinstallManager
              ID_PREINSTALL_MANAGER              = 0x00000210,
              ID_PREINSTALL_MANAGER_NOTIFICATION = 0x00000211,

              // Interface IDs for AppPackageManager (IPackageDownloader)
              ID_PACKAGE_DOWNLOADER              = 0x00000220,
              ID_PACKAGE_INFO_ITERATOR           = 0x00000221,
              ID_PACKAGE_DOWNLOADER_NOTIFICATION = 0x00000222,

              // Interface IDs for AppPackageManager (IPackageInstaller)
              ID_PACKAGE_INSTALLER               = 0x00000230,
              ID_PACKAGE_ITERATOR                = 0x00000231,
              ID_PACKAGE_INSTALLER_NOTIFICATION  = 0x00000232,
              ID_PACKAGE_KEY_VALUE_ITERATOR      = 0x00000233,

              // Interface IDs for AppPackageManager (IPackageHandler)
              ID_PACKAGE_HANDLER                 = 0x00000240,
              ID_PACKAGE_LOCK_ITERATOR           = 0x00000241
          };

          } // namespace Exchange
          } // namespace WPEFramework
          EOF

          # Patch the IAppManager.h to fix enum issues and include Ids.h
          sed -i '1i#include "Ids.h"' $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/IAppManager.h

          # Fix the missing enum value in IAppManager.h
          sed -i 's/APP_ERROR_REASON_UNKNOWN/APP_ERROR_REASON_NONE = 0, APP_ERROR_REASON_UNKNOWN/g' $GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces/IAppManager.h
      
      - name: Build SceneSet L1 Tests
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/sceneset/Tests/L1Tests"
          -B build/sceneset-l1-tests
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=17
          &&
          cmake --build build/sceneset-l1-tests -j8
          &&
          cmake --install build/sceneset-l1-tests

      - name: Run SceneSet unit tests without valgrind
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/scenesetL1TestResults.json"
          SceneSetL1TestsIN &&
          cp -rf $(pwd)/scenesetL1TestResults.json $GITHUB_WORKSPACE/scenesetL1TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/scenesetL1TestResults.json

      - name: Run SceneSet first-boot marker unit tests
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          SceneSetL1TestsMarkerIN

      - name: Run SceneSet unit tests with valgrind
        if: ${{ !env.ACT }}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/scenesetL1TestResults.json"
          valgrind
          --tool=memcheck
          --log-file=valgrind_log_sceneset
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          SceneSetL1TestsIN &&
          cp -rf $(pwd)/scenesetL1TestResults.json $GITHUB_WORKSPACE/scenesetL1TestResultsWithValgrind.json &&
          rm -rf $(pwd)/scenesetL1TestResults.json
      
      - name: Generate Code Coverage
        if: matrix.coverage == 'with-coverage'
        run: |
          lcov --capture --directory . --output-file coverage.info 
          lcov --remove coverage.info '/usr/*' '*/build/*' '*/install/*' '*/Tests/*' --output-file filtered_coverage.info
          lcov --list filtered_coverage.info
          genhtml filtered_coverage.info --output-directory coverage

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L1-sceneset
          path: |
            coverage/
            valgrind_log_sceneset
            scenesetL1TestResultsWithoutValgrind.json
            scenesetL1TestResultsWithValgrind.json
          if-no-files-found: warn
